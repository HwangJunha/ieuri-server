# 빌드 속도 설정.
#
# **이 파일이 없으면 Gradle이 보수적인 기본값으로 돈다** — 병렬 실행도, 설정 캐시도 꺼져
# 있고 데몬 힙은 512MB다. QueryDSL kapt가 그 위에서 돌면서 CI 시간의 대부분을 먹었다
# (전체 4분43초 중 kapt+컴파일이 2분35초, 실제 테스트는 41초).

# 서로 의존하지 않는 태스크를 동시에 돌린다. GitHub Actions 러너가 4코어라 효과가 있다.
org.gradle.parallel=true

# 태스크 출력을 재사용한다. CI에서는 setup-gradle이 캐시를 복원하므로, 바뀌지 않은
# 모듈은 다시 컴파일하지 않는다.
org.gradle.caching=true

# 태스크 그래프 자체를 캐시한다. 설정 단계(빌드 스크립트 평가)를 건너뛴다.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# **kapt가 메모리를 많이 쓴다.** 기본 512MB로는 GC가 반복되어 느려진다. 러너가 16GB라
# 3GB는 안전하다. -XX:+UseParallelGC는 짧게 살다 죽는 빌드 JVM에 G1보다 유리하다.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin 컴파일을 별도 프로세스가 아니라 Gradle 데몬 안에서 돌린다. 프로세스 기동
# 비용이 사라진다.
kotlin.compiler.execution.strategy=in-process

# kapt 자체 최적화. 증분 처리와 워커 API 사용으로 재빌드가 빨라진다.
kapt.incremental.apt=true
kapt.use.worker.api=true
# **kapt의 평균 빌드 시간 통계를 끈다.** 진단용이라 상시 켤 이유가 없다.
kapt.verbose=false

# Kotlin 증분 컴파일.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
