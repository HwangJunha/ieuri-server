name: lint

on:
  # feature → dev PR에서 스타일(ktlint)만 본다. 테스트 전체(test.yml)는 비용이 커 걸지 않지만,
  # 린트가 여기서 빠지면 위반이 dev에 머지된 뒤 build.yml의 check에서 드러나 배포를 막는다.
  pull_request:
    branches: [dev]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # 컴파일이 필요 없는 소스 검사라 kapt·Kotlin 컴파일이 돌지 않는다(로컬 실측 5초).
      - name: Lint
        run: ./gradlew lintKotlin --build-cache
