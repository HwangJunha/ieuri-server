name: test

on:
  # dev → master PR에서만 돈다. 운영 배포 직전이라 머지 전에 안전성을 확인한다.
  #
  # feature → dev PR에는 걸지 않는다 — 수정이 잦아 매번 도는 비용이 얻는 것보다 크고,
  # 실패하면 feature 브랜치에서 다시 돌리면 된다.
  pull_request:
    branches: [master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # bootJar는 돌리지 않는다. 169MB 패키징은 머지 후 build.yml이 어차피 다시 하므로
      # 여기서 하면 같은 일을 두 번 하는 셈이다.
      - name: Test
        # --no-daemon을 쓰지 않는 이유는 build.yml과 같다 — 데몬이 없으면 Kotlin
        # 컴파일러가 별도 JVM으로 돌아 gradle.properties의 in-process 전략이 무력화된다.
        run: ./gradlew check --build-cache
