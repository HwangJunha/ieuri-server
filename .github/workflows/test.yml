name: test

on:
  # dev → master PR에서만 돈다. feature → dev PR은 lint.yml만 돈다.
  pull_request:
    branches: [master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # bootJar는 돌리지 않는다 — 머지 후 build.yml이 한다.
      - name: Check
        # --no-daemon을 쓰지 않는다(build.yml과 같은 이유).
        run: ./gradlew check --build-cache
