name: build

on:
  # PR을 머지하면 대상 브랜치에 커밋이 얹히므로 push로 잡힌다 — 별도의 merge 트리거는 없다.
  # dev/master로의 직접 푸시는 브랜치 보호 규칙으로 막는다(저장소 설정, 이 파일 밖).
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev]
  # 재배포·복구용 수동 실행. 브랜치를 오지선택으로 제한해 feature 브랜치가 실수로
  # 레지스트리에 올라가지 않게 한다.
  workflow_dispatch:
    inputs:
      branch:
        description: 빌드할 브랜치
        type: choice
        options: [dev, master]
        default: dev

concurrency:
  # 수동 실행은 선택한 브랜치를, 나머지는 이벤트의 ref를 그룹 키로 쓴다.
  group: build-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 수동 실행에서는 드롭다운으로 고른 브랜치를 받는다. 지정하지 않으면 워크플로 파일을
          # 고른 브랜치가 아니라 이벤트의 기본 ref가 체크아웃된다.
          ref: ${{ inputs.branch || github.ref }}

      # 실제로 체크아웃된 커밋을 읽어 태그에 쓴다. 수동 실행에서 github.sha는 워크플로 파일을
      # 고른 브랜치의 커밋이라 빌드한 코드와 다를 수 있고, 그러면 sha- 태그가 거짓말을 한다.
      - id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build jar
        run: ./gradlew test bootJar --no-daemon

      # 아래 단계는 push와 수동 실행에서만 — PR은 검증만 하고 이미지를 올리지 않는다.
      # JAR은 아키텍처 독립이라 빌드는 x86 네이티브로 돌리고 이미지 조립만 arm64로 한다.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        if: github.event_name != 'pull_request'
        with:
          images: ghcr.io/hwangjunha/ieuri-server
          # sha- 태그는 불변이라 롤백 대상을 정확히 가리키고, 브랜치 태그는 그 브랜치의 최신을 가리킨다.
          # 브랜치명을 직접 지정한다 — 수동 실행에서 github.ref는 워크플로 파일을 고른 브랜치라
          # inputs.branch로 체크아웃한 브랜치와 어긋날 수 있다.
          tags: |
            type=raw,value=sha-${{ steps.rev.outputs.sha }}
            type=raw,value=${{ inputs.branch || github.ref_name }}

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
