name: build

on:
  # 머지(dev/master 푸시)될 때만 돈다. PR 검증은 test.yml·lint.yml이 맡는다.
  push:
    branches: [dev, master]
  # 재배포·복구용 수동 실행. feature 브랜치가 레지스트리에 올라가지 않게 브랜치를 선택지로 제한한다.
  workflow_dispatch:
    inputs:
      branch:
        description: 빌드할 브랜치
        type: choice
        options: [dev, master]
        default: dev

concurrency:
  # 수동 실행은 선택한 브랜치를, 나머지는 이벤트의 ref를 그룹 키로 쓴다.
  group: build-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # 수동 실행에서는 드롭다운으로 고른 브랜치를 체크아웃한다.
          ref: ${{ inputs.branch || github.ref }}

      # 실제로 체크아웃된 커밋으로 태그를 만든다(수동 실행에서 github.sha는 빌드한 코드와 다를 수 있다).
      # 환경 접두사를 함께 낸다 — 없으면 Image Updater가 dev 이미지와 prod 이미지를 가리지 못한다.
      - id: rev
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # 커밋 시각(Unix). build-push-action의 SOURCE_DATE_EPOCH로 넘겨 이미지 config의
          # `created`를 못 박는다 — 캐시된 레이어의 값을 물려받지 않게 하기 위함이다.
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          branch="${{ inputs.branch || github.ref_name }}"
          case "$branch" in
            master) echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            dev)    echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
            # 워크플로 트리거가 dev·master로 한정되어 여기 오지 않는다. 그래도 빈 접두사로
            # 흘려보내면 `-sha-`가 되어 두 환경의 정규식에 모두 걸리지 않는 태그가 조용히
            # 쌓이므로, 이름을 그대로 써서 눈에 띄게 둔다.
            *)      echo "env=$branch" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check and build jar
        # --no-daemon을 쓰지 않는다 — 데몬이 없으면 in-process 컴파일 전략과 설정 캐시가 무력화된다.
        run: ./gradlew check bootJar --build-cache

      # JAR은 아키텍처 독립이라 빌드는 x86 네이티브로 돌리고 이미지 조립만 arm64로 한다.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hwangjunha/ieuri-server
          # 환경 접두사(dev-sha-… / prod-sha-…)가 Image Updater 필터의 근거다(매니페스트 server.allow-tags와 짝).
          # 브랜치 태그는 사람용이며 Image Updater는 보지 않는다.
          # 브랜치명은 inputs.branch로 직접 지정한다 — 수동 실행에서 github.ref와 어긋날 수 있다.
          tags: |
            type=raw,value=${{ steps.rev.outputs.env }}-sha-${{ steps.rev.outputs.sha }}
            type=raw,value=${{ inputs.branch || github.ref_name }}

      - uses: docker/build-push-action@v7
        # SOURCE_DATE_EPOCH를 커밋 시각으로 못 박는다 — 없으면 캐시된 레이어의 `created`를 물려받아
        # 값이 동률이 되고, Image Updater(newest-build)가 성공 로그를 남기며 조용히 멈춘다.
        env:
          SOURCE_DATE_EPOCH: ${{ steps.rev.outputs.epoch }}
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
