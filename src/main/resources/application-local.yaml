# 로컬(local) 프로파일 전용 값. 여기 값들은 개발 전용이며 운영 값과 반드시 다르다.
# 주의: DB 비밀번호는 여기 두지 않는다(셸 환경변수 IEURI_DB_PASSWORD로 주입).

# 로컬 개발 편의를 위해 8888을 유지한다. 배포 환경은 application.yaml의 8080을 쓴다.
server:
  port: 8888

ieuri:
  tourapi:
    detail-prefetch:
      # 로컬에서는 상세 수집을 돌리지 않는다(SPEC-0037) — 쿼터가 dev·prod와 같은 계정에서 나간다.
      # 0이면 Tasklet이 첫 판정에서 끝나 호출이 나가지 않는다.
      daily-limit: 0
  # 검색 노드도 같은 port-forward 터널 위라 SSL을 끈다(아래 spring.datasource 참조).
  search-datasource:
    url: ${IEURI_SEARCH_DB_URL:jdbc:postgresql://localhost:5433/ieuri?prepareThreshold=0&sslmode=disable}
  mail:
    from: noreply@ieuri.co.kr
spring:
  # `kubectl port-forward` 터널 위에서는 SSL 핸드셰이크가 깨져 터널이 내려간다 — 로컬 전용으로 SSL을 끈다.
  datasource:
    url: ${IEURI_DB_URL:jdbc:postgresql://localhost:5432/ieuri?sslmode=disable}
  jpa:
    show-sql: true

# 구독(WebSocket) 디버깅용. 로컬 전용이다.
# 연결 수립이 실패하면 애플리케이션 로그가 남지 않으므로 핸드셰이크·connection_init·subscribe를 켠다.
logging:
  level:
    # 핸드셰이크가 실제로 도달했는지, 어떤 서브프로토콜로 붙었는지.
    org.springframework.web.socket: DEBUG
    # connection_init / subscribe / complete 프레임과 구독 생명주기.
    org.springframework.graphql: DEBUG
    # 우리 인터셉터의 판정 로그.
    org.around.ieuri.auth.infrastructure.security: DEBUG
    # 푸시 발송 경로. 로컬 전용이다 — 조용히 걸러지는 정상 분기(수신 거부·차단·기기 없음)가 어디서 멈췄는지 본다.
    org.around.ieuri.alarm: DEBUG

management:
  tracing:
    export:
      # 로컬에는 수집기가 없어 전송을 끈다. span 생성과 로그의 trace ID는 그대로다.
      # 주소(otlp.endpoint)를 이 파일에 두지 않는다 — 값이 없어 placeholder 해석에서 부팅이 실패한다.
      enabled: false
