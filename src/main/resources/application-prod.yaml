# prod 프로파일. 접속 정보는 application.yaml의 ${ENV} 자리에 k8s가 주입한다(비밀값은 Secret).
# 값이 application.yaml 기본값과 같아도 명시한다 — 공통 기본값이 바뀌어도 운영이 조용히 따라가지 않게 한다.

spring:
  datasource:
    hikari:
      # 쓰기·읽기 두 풀 각각에 적용된다. DB max_connections와 파드 수를 함께 보고 정한다.
      # 올릴 때는 DB(max_connections) 매니페스트를 먼저 머지한다 — 순서가 뒤집히면 커넥션이 거절된다.
      maximum-pool-size: 60
  graphql:
    schema:
      introspection:
        # 스키마 전문 공개를 막는다. 정상 앱은 스키마를 이미 알고 호출하므로 꺼도 지장이 없다.
        enabled: false

logging:
  level:
    root: INFO
    # local이 켜 둔 DEBUG가 운영에 새어 들어오지 않도록 우리 패키지를 INFO로 고정한다.
    org.around.ieuri: INFO

management:
  tracing:
    sampling:
      # 1%만 수집한다(JDBC 계측이 쿼리마다 span을 만든다). dev와 같은 값이어야 부하 테스트 결과를 운영에 쓸 수 있다.
      probability: 0.01

  # 클러스터 안의 Alloy를 가리킨다.
  # - 경로에 /v1/traces까지 붙여야 한다 — 신호별 경로를 자동으로 붙이지 않아 4318만 주면 404가 된다.
  # - OTEL_EXPORTER_OTLP_ENDPOINT로는 주입되지 않는다 — Micrometer 브리지는 이 속성만 본다.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${IEURI_TRACING_ENDPOINT}

ieuri:
  tourapi:
    detail-prefetch:
      # 전량 수집(SPEC-0037). 오퍼레이션당 쿼터 10만 중 1만을 사용자 조회(FR-010) 몫으로 남긴다.
      daily-limit: ${IEURI_TOUR_DETAIL_PREFETCH_DAILY_LIMIT:90000}
