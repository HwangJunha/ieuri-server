# prod 프로파일. dev와 **같은 클러스터에 네임스페이스로만 갈린다** — 접속 정보는 여기 두지
# 않고 application.yaml의 ${ENV} 자리에 k8s가 주입한다(비밀값은 Secret).
#
# **이 파일의 값은 전부 application.yaml의 기본값과 같다.** 그런데도 명시하는 이유는,
# 기본값에 의존하면 누군가 공통 기본값을 개발 편의로 바꿨을 때 운영이 조용히 따라가기
# 때문이다. 운영에서 절대 켜지면 안 되는 것만 여기서 못 박는다.

spring:
  datasource:
    hikari:
      # 파드당 20(PERF-20260921). **application.yaml 기본값과 같지만 명시한다** — 커넥션
      # 상한은 DB의 `max_connections`와 파드 수를 함께 봐야 정해지는 값이라, 공통 기본값이
      # 개발 편의로 올라갔을 때 운영이 조용히 따라가면 DB가 커넥션을 거절한다.
      maximum-pool-size: 20
  jpa:
    # 질의 로그를 남기지 않는다. 파라미터에 개인정보가 실릴 수 있고 양도 많다.
    show-sql: false
  graphql:
    schema:
      introspection:
        # **스키마 전문 공개를 막는다.** 운영 API는 인터넷에 열려 있어야 하므로(앱이 어디서든
        # 붙는다) 네트워크로 막을 수 없고, 방어선은 인증·인가다. 그렇다면 최소한 공격자가
        # 무엇을 노릴지 고르는 것을 돕지는 말아야 한다.
        #
        # 인트로스펙션이 열려 있으면 모든 쿼리·뮤테이션과 필드 목록이 그대로 덤프된다.
        # 정상 앱은 스키마를 이미 알고 호출하므로 꺼도 동작에 지장이 없다.
        enabled: false

logging:
  level:
    root: INFO
    # local 프로파일이 켜 둔 DEBUG(웹소켓·graphql·alarm)가 운영에 새어 들어오지 않도록
    # 우리 패키지를 INFO로 고정한다.
    org.around.ieuri: INFO

management:
  tracing:
    sampling:
      # 10%만 수집한다. 전량으로 두면 요청마다 span 트리를 만들어 CPU와 네트워크를 쓰는데,
      # 2 OCPU 단일 노드에는 그만한 여유가 없다. 이 파일의 다른 값들과 마찬가지로 공통
      # 기본값과 같은 값이지만, 개발 편의로 기본값이 올라갔을 때 운영이 조용히 따라가지
      # 않도록 여기서 못 박는다.
      #
      # 표본이라 **개별 요청을 지목해 찾는 용도로는 쓸 수 없다.** 특정 장애 요청을 봐야
      # 하면 그때 값을 올리고 재현한다.
      probability: 0.1

  # 클러스터 안의 Alloy 를 가리킨다. Grafana Cloud 를 직접 가리키지 않으므로 자격증명이
  # 앱까지 내려오지 않고, 바깥이 느려져도 그 지연이 앱으로 번지지 않는다.
  #
  # **경로에 /v1/traces 까지 붙는다.** 이 속성은 OpenTelemetry SDK 와 달리 신호별 경로를
  # 자동으로 붙이지 않아, 4318 만 주면 루트로 POST 하고 404 가 된다.
  #
  # **OTEL_EXPORTER_OTLP_ENDPOINT 로는 주입되지 않는다.** 그것은 SDK 의 표준 변수이고
  # Micrometer 브리지는 이 속성만 본다 — 그 이름으로 주면 앱은 정상으로 뜨는데 span 만
  # 나가지 않아 대시보드가 빈 이유가 드러나지 않는다.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${IEURI_TRACING_ENDPOINT}

ieuri:
  tourapi:
    detail-prefetch:
      # 전량 수집(SPEC-0037). 오퍼레이션당 쿼터 10만에서 1만을 사용자 조회 시점 확보(FR-010)
      # 몫으로 남긴다 — 배치가 다 쓰면 그날 조회가 upstream에 닿지 못한다.
      # **application.yaml 기본값과 같지만 명시한다** — 기본값이 개발 편의로 바뀌어도
      # 운영이 조용히 따라가지 않게 한다(이 파일의 다른 값과 같은 이유).
      daily-limit: ${IEURI_TOUR_DETAIL_PREFETCH_DAILY_LIMIT:90000}
