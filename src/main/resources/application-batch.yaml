# 배치 전용 설정. batch 프로파일에서만 로드된다.
# 부팅하면 1회 실행 후 종료한다. 언제 띄울지는 k8s CronJob이 소유한다(앱에 스케줄러를 두면 두 번 돈다).
#   로컬  ./gradlew bootRun --args='--spring.profiles.active=local,batch'
#   k3s   CronJob에서 --spring.profiles.active=prod,batch

spring:
  datasource:
    hikari:
      # 공통값을 상속하지 않는다 — 배치 파드는 API 파드와 별도로 떠 커넥션 예산에 더해지는 몫이다.
      # 상한은 상세 수집 잡의 병렬 4갈래 + 잡 리포지터리 몫이다.
      maximum-pool-size: 8
  batch:
    job:
      # 부팅 시 자동 실행 금지. 실행할 잡은 아래 ieuri.tourapi.sync.job이 고른다.
      enabled: false
  main:
    # 배치는 HTTP 표면을 갖지 않는다 — 포트를 잡으면 API 파드와 충돌한다.
    web-application-type: none

ieuri:
  tourapi:
    sync:
      # 실행할 잡 이름. 런처가 등록된 Job 빈 중 이름이 맞는 것을 돌린다.
      # tourism 잡만 고르는 이름이 아니다 — 다른 도메인의 잡도 이 값으로 고른다(예: messageRetentionJob).
      job: ${IEURI_TOUR_SYNC_JOB:spotSyncJob}
      # 수집용 numOfRows. 조회 경로의 max-page-size(100)와 별개다. 업스트림이 거부하면 낮춘다.
      page-size: ${IEURI_TOUR_SYNC_PAGE_SIZE:1000}
      # runDate의 시간대. "하루"의 경계이자 중복 실행 방지의 기준이다.
      zone: Asia/Seoul

    festival-sync:
      # 상한이 실측되지 않았다 — 업스트림이 거부하면 이 값만 낮춘다.
      page-size: ${IEURI_TOUR_FESTIVAL_PAGE_SIZE:1000}

    # 관광지 상세 사전 전량 수집(SPEC-0037, spotDetailPrefetchJob). 출발값이다(POL-044).
    detail-prefetch:
      # 한 번에 뽑는 대상 수. 이 단위가 트랜잭션·커서 전진의 경계다.
      batch-size: ${IEURI_TOUR_DETAIL_PREFETCH_BATCH_SIZE:200}
      # 마지막 확보로부터 이 기간이 지나면 다시 확보한다(FR-007).
      refresh-after: ${IEURI_TOUR_DETAIL_PREFETCH_REFRESH_AFTER:30d}
      # 한 갈래가 초당 던지는 upstream 호출 수. 한도는 (언어 × 오퍼레이션)마다 초당 50이다.
      calls-per-second: ${IEURI_TOUR_DETAIL_PREFETCH_CALLS_PER_SECOND:40}
      # 한 갈래가 하루에 처리할 장소 수(= 호출 수). 쿼터 10만 중 1만을 사용자 조회(FR-010) 몫으로 남긴다.
      daily-limit: ${IEURI_TOUR_DETAIL_PREFETCH_DAILY_LIMIT:90000}

  # 한국관광공사 관광통계 4종(SPEC-0015). 갱신 주기가 갈려 잡을 나눴다 — 묶으면 월 단위가 매일 헛돈다.
  #   tourStatsVisitorCountSyncJob · tourStatsConcentrationRateSyncJob        매일
  #   tourStatsStayIntensitySyncJob · tourStatsSpendingIntensitySyncJob       매월 17일 이후
  tour-stats:
    sync:
      # 월 지표의 기준월 탐색 창(개월). 이번 달부터 거슬러 올라가며 데이터가 있는 첫 달을 쓴다.
      # 창 안에 데이터가 없으면 0건 적재로 정상 종료한다. 월은 실행당 한 번만 정한다.
      monthly-lookback-months: 6
      # 매번 최근 구간을 통째로 다시 받는다(upsert). 방문자수는 약 30일 지연 공개되므로 넉넉히 잡는다.
      visitor-backfill-days: 90

  # 시군구 대표 위치 선정(SPEC-0015, districtRepresentativeLocationJob).
  # spot 동기화 이후에 스케줄해야 한다 — 순서가 뒤집히면 전날 데이터로 계산한다.
  district-representative:
    # 밀집 격자 한 칸(도). 0.02 ≈ 2km — 도보권 "한 동네" 단위.
    cell-size-degrees: 0.02
    # 가장 밀집한 격자의 최소 spot 수(KO 행 기준). 미달이면 NULL로 두어 추천에서 뺀다.
    min-spot-count: 10


logging:
  level:
    org.springframework.batch: INFO
    org.around.ieuri.tourism.infrastructure.batch: INFO
