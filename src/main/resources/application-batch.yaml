# 관광지 동기화 배치 전용 설정(SPEC-0004). **batch 프로파일에서만 로드된다.**
#
# 배치는 API 서버와 **다른 프로세스로 뜬다** — 로컬은 수동 실행, k3s는 CronJob이다.
# 그래서 설정도 여기 모아 두고, 배치가 아닌 프로세스는 이 파일을 아예 읽지 않는다.
# API 파드에 스케줄러가 딸려 올라가 배치가 두 번 도는 사고를 구조적으로 막는 것이 목적이다.
#
# **실행 시점은 앱이 정하지 않는다.** 부팅하면 즉시 1회 실행하고 프로세스가 종료된다.
# 언제 띄울지는 k8s CronJob(또는 kubectl create job)이 소유한다 — 앱에 스케줄러를 두면
# 트리거가 둘이 되어 하루 두 번 도는 사고가 난다.
#
# 실행:
#   로컬  ./gradlew bootRun --args='--spring.profiles.active=local,batch'
#   k3s   CronJob에서 --spring.profiles.active=prod,batch
#   수동  kubectl create job --from=cronjob/<name> <run-name> -n <ns>
#
# 공통 설정(datasource·flyway·tourapi 자격증명 등)은 application.yaml에서 그대로 상속받는다.
# 여기에는 **배치일 때만 달라지는 값**만 둔다.

spring:
  batch:
    job:
      # 부팅 시 자동 실행하지 않는다. 실행할 잡은 SpotSyncLauncher가 ieuri.tourapi.sync.job으로
      # 선택한다 — 트리거가 둘이 되어 하루 두 번 도는 사고를 막는다.
      # application.yaml에서 이미 끄지만, 배치 프로세스에서 특히 중요하므로 여기서도 명시한다.
      enabled: false

  # spring.batch.jdbc.*는 두지 않는다 — Boot 4에 없는 키다. 메타데이터 저장소는
  # BatchInfrastructureConfig의 @EnableJdbcJobRepository가 정하고, 스키마는 Flyway 소유다(V14).

  # 배치는 HTTP 표면을 갖지 않는다(POL-021: 배치는 내부 잡). CronJob으로 뜨는 파드가
  # 포트를 잡으면 API 파드와 충돌하고, 열어 둘 이유도 없다.
  main:
    web-application-type: none

ieuri:
  tourapi:
    sync:
      # 실행할 잡. 외부에서 바꿀 수 있게 둔다 — 잡이 늘어나도 런처 코드는 그대로다.
      job: ${IEURI_TOUR_SYNC_JOB:spotSyncJob}

      # areaBasedSyncList2의 numOfRows. 조회 경로의 max-page-size(100)와 별개다
      # (수집 효율 vs 응답 크기). 1000은 아직 실측되지 않았다 — upstream이 거부하면
      # 이 값을 낮춘다(설계 문서 §4.2). 실측: 1000건 upsert에 약 0.2초.
      page-size: ${IEURI_TOUR_SYNC_PAGE_SIZE:1000}

      # 사라진 항목 정리의 급감 게이트. 수집 건수가 기존 적재의 이 비율 미만이면 정리를 건너뛴다 —
      # 업스트림 이상으로 대량 오삭제되는 것을 막는다.
      cleanup-min-ratio: ${IEURI_TOUR_SYNC_CLEANUP_MIN_RATIO:0.5}

      # runDate 잡 파라미터의 시간대. "하루"의 경계를 정하므로 중복 실행 방지(AC-6)의 기준이며,
      # 축제 Step의 종료 판정 기준일도 같은 값에서 나온다(SPEC-0007).
      # 실행 스케줄 자체는 k8s CronJob이 소유한다 — 앱에는 스케줄러가 없다.
      zone: Asia/Seoul

    # 축제 정보 수집(SPEC-0007). 같은 spotSyncJob 안에서 관광지 Step 뒤에 돈다 — 별도 잡·CronJob이
    # 아니므로 스케줄 설정이 없다.
    festival-sync:
      # searchFestival2의 numOfRows. **이 오퍼레이션은 이 레포에서 호출된 적이 없어 상한이
      # 실측되지 않았다([TBD-3]).** 관광지와 같은 1000으로 시작하고, 업스트림이 거부하면 이 값만 낮춘다.
      page-size: ${IEURI_TOUR_FESTIVAL_PAGE_SIZE:1000}

  # 한국관광공사 빅데이터 4종 동기화(SPEC-0015 §2.1). 잡이 4개로 나뉘어 있고 실행할 하나는
  # 위 ieuri.tourapi.sync.job이 고른다 — 런처는 등록된 Job 빈 중 이름이 맞는 것을 돌린다:
  #   ktoVisitorCountSyncJob        일 단위 (CronJob: 매일)
  #   ktoConcentrationRateSyncJob   일 단위 (CronJob: 매일)
  #   ktoStayIntensitySyncJob       월 단위 (CronJob: 매월 17일 이후)
  #   ktoSpendingIntensitySyncJob   월 단위 (CronJob: 매월 17일 이후)
  #
  # 갱신 주기가 일/월로 갈려 하나의 잡으로 묶지 않는다 — 묶으면 월 단위 종이 매일 헛돈다.
  kto-bigdata:
    sync:
      # 방문자수 조회의 소급 일수. **이동통신 원천이 4일 지연 공개된다**(spec §4.6) —
      # 오늘 날짜로 부르면 빈 응답이 온다. 데이터랩 포털의 갱신 주기 표에서 확인한 관측
      # 사실이며 API 매뉴얼에 없는 값이라(계약상 보장이 아님) 설정으로 둔다.
      visitor-lag-days: 4
      # 월 단위 지표의 소급 개월. 매월 16일 발표라 이번 달을 요청하면 대부분 빈 응답이다.
      monthly-lag-months: 1

      # 매 실행이 다시 받아올 방문자수 구간(일). **하루치만 받으면 배치가 실패한 날의
      # 데이터가 영구히 빈다** — 다음 실행은 그 다음날치를 가져갈 뿐이고, 배치는 매일
      # 성공하는데 데이터에만 구멍이 남아 아무도 모른다.
      #
      # 자연키 upsert라(R7) 재수집해도 행이 늘지 않고 바뀐 값만 갱신된다. API가 날짜 범위를
      # 지원해 30일치가 호출 1건이다(1일 = 시군구 740행, 페이지 크기 1,000).
      visitor-backfill-days: ${IEURI_KTO_VISITOR_BACKFILL_DAYS:30}

  # 시군구 대표 위치 선정(SPEC-0015 · V46). 잡 이름은 sigunguRepresentativeLocationJob이며
  # 위 ieuri.tourapi.sync.job으로 고른다.
  #
  # **spot 동기화 CronJob 이후에 스케줄해야 한다** — spot 테이블을 읽어 산출하므로 순서가
  # 뒤집히면 전날 데이터로 계산한다. spotSyncJob에 Step으로 붙지 않았으므로(런처가 잡 하나만
  # 고른다) 순서는 CronJob 스케줄이 보장한다. 예: spot 04:00 → 이 잡 06:00.
  sigungu-representative:
    # 밀집 격자 한 칸의 크기(도). 0.02도 ≈ 위도 2km.
    # 실측(2026-08-11, cell=0.02 · min=10 · KO 한정): 252개 중 226개 선정 · 26개 NULL,
    # 영덕군 최근접 spot 거리 5842m → 219m, 대표 위치가 자기 지역 밖으로 나간 건 0개.
    # 상수가 아니라 실측 기반 잠정값이다(POL-044).
    cell-size-degrees: ${IEURI_SIGUNGU_REPRESENTATIVE_CELL_SIZE:0.02}

    # 가장 밀집한 격자의 최소 spot 수. 미달이면 대표 위치를 NULL로 두어 추천에서 제외한다 —
    # 갈 곳이 없는 지역을 추천하지 않기 위한 문턱이다.
    #
    # **KO 행 기준이다.** spot은 언어마다 다른 행이라 전 언어를 세면 같은 장소가 최대 4번
    # 잡혀, 번역이 잘 된 지역일수록 문턱을 쉽게 넘는다. 값을 조정할 때 이 점을 잊으면 안 된다
    # (전 언어 기준 20 ≈ KO 기준 10이 아니다 — 커버리지가 지역마다 다르다).
    min-spot-count: ${IEURI_SIGUNGU_REPRESENTATIVE_MIN_SPOT_COUNT:10}

logging:
  level:
    org.springframework.batch: INFO
    org.around.ieuri.tourism.infrastructure.batch: INFO
