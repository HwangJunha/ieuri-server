# dev 프로파일. 접속 정보·자격증명은 application.yaml의 ${ENV} 자리에 k8s가 주입한다.
# 이 파일에는 관측 강도만 둔다. 비밀값은 어떤 경우에도 여기 두지 않는다.

spring:
  jpa:
    # 질의를 눈으로 확인한다. prod에서는 끈다.
    show-sql: true
  graphql:
    schema:
      introspection:
        # 스키마 전문 공개를 막는다. 스키마를 훑어봐야 하는 개발은 local에서 한다.
        enabled: false

logging:
  level:
    # 우리 코드만 DEBUG로 둔다. root를 내리면 Hibernate·Netty까지 딸려 와 신호가 묻힌다.
    org.around.ieuri: DEBUG

management:
  tracing:
    sampling:
      # 1%만 수집한다. 운영과 같은 값이어야 dev 부하 테스트 결과를 운영 용량 판단에 쓸 수 있다.
      probability: 0.01

  # 클러스터 안의 Alloy를 가리킨다.
  # - 경로에 /v1/traces까지 붙여야 한다 — 신호별 경로를 자동으로 붙이지 않아 4318만 주면 404가 된다.
  # - OTEL_EXPORTER_OTLP_ENDPOINT로는 주입되지 않는다 — Micrometer 브리지는 이 속성만 본다.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${IEURI_TRACING_ENDPOINT}

ieuri:
  tourapi:
    detail-prefetch:
      # dev는 기본적으로 돌지 않는다(SPEC-0037) — TourAPI 키가 prod와 같은 계정이라 함께 돌면 초당 한도를 넘긴다.
      # 0이면 Tasklet이 첫 판정에서 끝나 호출이 나가지 않는다.
      daily-limit: ${IEURI_TOUR_DETAIL_PREFETCH_DAILY_LIMIT:0}
