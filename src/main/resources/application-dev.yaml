# dev 프로파일. prod와 **같은 클러스터에 네임스페이스로만 갈린다** — 인프라 엔드포인트가
# 환경별로 다르지 않으므로 접속 정보는 여기 두지 않는다. DB·Valkey·외부 API 자격증명은
# 전부 application.yaml의 ${ENV} 자리에 k8s가 주입한다.
#
# 그래서 이 파일에 남는 것은 **관측 강도**뿐이다. 값이 늘어난다면 그건 대개 환경 차이가
# 아니라 주입돼야 할 값이 여기 새어 들어온 것이다.
#
# 비밀값은 어떤 경우에도 여기 두지 않는다.

spring:
  jpa:
    # 질의를 눈으로 확인한다. prod에서는 끈다 — 파라미터가 로그로 나가고 양도 많다.
    show-sql: true
  graphql:
    schema:
      introspection:
        # **스키마 전문 공개를 막는다.** 인트로스펙션이 열려 있으면 누구나 모든 쿼리·뮤테이션과
        # 필드 목록을 덤프할 수 있어, 공격자에게 API 지도를 그려 주는 셈이 된다.
        #
        # 정상 클라이언트는 스키마를 이미 알고 호출하므로 꺼도 동작에 지장이 없다. 스키마를
        # 훑어봐야 하는 개발은 local에서 한다 — 기본값이 true라 local은 그대로 켜져 있다.
        enabled: false

logging:
  level:
    # 우리 코드만 DEBUG로 둔다. root를 내리면 Hibernate·Netty까지 딸려 와 신호가 묻힌다.
    org.around.ieuri: DEBUG

management:
  tracing:
    sampling:
      # 1%만 수집한다. **운영과 같은 값으로 둔다** — 부하 테스트를 dev 에서 돌리는데
      # 표본 비율이 다르면 그 결과를 운영 용량 판단에 쓸 수 없다.
      #
      # 전량이던 값을 내린 이유는 JDBC 계측이 **쿼리마다 span 을 만들기** 때문이다.
      # N+1 이 있는 요청은 span 이 수십 개가 되고, 그 생성·전송이 CPU 를 쓴다
      # (PERF-20260921 에서 CPU 가 선형 병목임이 확인됐다).
      #
      # 표본이라 **개별 요청을 지목해 찾는 용도로는 쓸 수 없다.** 특정 요청을 따라가야
      # 하면 그때 값을 올리고 재현한다.
      probability: 0.01

  # 클러스터 안의 Alloy 를 가리킨다. Grafana Cloud 를 직접 가리키지 않으므로 자격증명이
  # 앱까지 내려오지 않고, 바깥이 느려져도 그 지연이 앱으로 번지지 않는다.
  #
  # **경로에 /v1/traces 까지 붙는다.** 이 속성은 OpenTelemetry SDK 와 달리 신호별 경로를
  # 자동으로 붙이지 않아, 4318 만 주면 루트로 POST 하고 404 가 된다.
  #
  # **OTEL_EXPORTER_OTLP_ENDPOINT 로는 주입되지 않는다.** 그것은 SDK 의 표준 변수이고
  # Micrometer 브리지는 이 속성만 본다 — 그 이름으로 주면 앱은 정상으로 뜨는데 span 만
  # 나가지 않아 대시보드가 빈 이유가 드러나지 않는다.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${IEURI_TRACING_ENDPOINT}

ieuri:
  tourapi:
    detail-prefetch:
      # **dev는 기본적으로 돌지 않는다**(SPEC-0037). TourAPI 키가 prod와 같은 계정이라
      # 같은 시각에 함께 돌면 초당 한도를 두 환경이 합쳐서 넘긴다 — 한 환경이 이미
      # 초당 160(갈래당 40 × 4갈래)을 쓰므로 둘이면 320이고, 실측상 그 구간은 대부분
      # 429로 돌아온다. 일일 쿼터보다 초당 한도가 먼저 터진다.
      #
      # 0이면 Tasklet이 첫 판정에서 끝내 호출이 아예 나가지 않는다 — CronJob은 돌되
      # 몇 초에 끝난다. prod가 안정화된 뒤 이 값을 환경변수로 올려 검증한다.
      daily-limit: ${IEURI_TOUR_DETAIL_PREFETCH_DAILY_LIMIT:0}
