spring:
  application:
    name: ieuri
  threads:
    virtual:
      # 요청 처리와 데이터페처를 가상 스레드로 돌린다. DGS 가상 스레드 키도 이 값을 따른다.
      # 데이터페처가 다른 스레드에서 돌므로 요청별 값을 ThreadLocal·요청 스코프 빈에 담지 않는다 —
      # 언어·앱키는 DataFetchingEnvironment에서 읽는다.
      enabled: true
  lifecycle:
    # graceful shutdown 단계별 최대 대기. write-behind 큐도 이 안에서 정리된다.
    timeout-per-shutdown-phase: 20s
  profiles:
    default: local
  datasource:
    url: ${IEURI_DB_URL:jdbc:postgresql://localhost:5432/ieuri}
    username: ${IEURI_DB_USERNAME:ieuri}
    # 비밀값: 커밋 금지. prod는 환경변수 주입, local은 셸 환경변수(IEURI_DB_PASSWORD)로 제공.
    password: ${IEURI_DB_PASSWORD}
    hikari:
      # raw SQL·트리거 함수가 스키마 한정 없이 부르는 이름의 해석 경로(SPEC-0023).
      # - `public`을 빼면 안 된다 — PostGIS(geography, ST_*)가 거기 설치돼 있다.
      # - `batch`는 넣지 않는다 — 배치 메타 테이블은 tablePrefix로 스키마 한정되며, 넣으면 한정 없는 이름이 조용히 해석된다.
      # - URL(환경변수로 통째 주입)이 아니라 여기 둔다.
      connection-init-sql: SET search_path TO auth, community, tour, category, alarm, public
      # 쓰기·읽기 두 풀 각각에 적용된다(replicaDataSource가 이 블록을 공유) — 파드당 쓰기 60 + 읽기 60.
      # 올리기 전에 DB max_connections(ieuri-manifest)가 먼저 올라가 있어야 한다. 아니면 기동 즉시 거절된다.
      # 풀 증설은 임시 처방이다(근본은 recommendedSpots 쿼리 경량화). 올리기 전 replica의 work_mem×동시성이 2Gi 안인지 확인한다.
      maximum-pool-size: 60
      keepalive-time: 120000
      # 첫 커넥션 확보를 30초까지 재시도한다(기본 1초는 즉시 실패).
      initialization-fail-timeout: 30000
      # 커넥션 수명 10분. 터널 재시작·CNPG 장애 조치로 끊긴 커넥션의 유일한 방어선이다 —
      # keepalive는 유휴 커넥션에만 동작하고, Postgres 쪽 타임아웃은 전부 0이다.
      max-lifetime: 600000
  jpa:
    hibernate:
      # 스키마 소유권은 Flyway. Hibernate는 엔티티↔스키마 검증만 한다.
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      # 부팅 시 잡을 자동 실행하지 않는다 — 기본값 true라 끄지 않으면 재배포마다 전량 동기화가 돈다.
      enabled: false

  # spring.batch.jdbc.*는 Boot 4에 없는 키라 조용히 무시된다 — 메타데이터 저장소는 @EnableJdbcJobRepository가 소유한다.
  flyway:
    enabled: true
    # Java 마이그레이션 패키지를 여기 더하지 않는다 — 중복 스캔으로 부팅이 깨진다. 빈 주입(DataSourceConfig.flyway)으로 등록한다.
    locations: classpath:db/migration
    # v0로 baseline 후 V1부터 전부 적용한다(공유 DB에 기존 객체가 있을 수 있음).
    baseline-on-migrate: true
    baseline-version: 0
    # 적용된 R__ 파일을 지운 경우만 validate에서 무시한다. V__의 누락·체크섬 변경은 그대로 잡힌다.
    ignore-migration-patterns: "repeatable:missing"
  graphql:
    websocket:
      # 구독 전송 경로. 명시하지 않으면 WebSocket 핸들러가 등록되지 않아 구독이 조용히 실패한다.
      # 인증은 connection_init에서 1회 수행한다(POL-048).
      path: /graphql
      # connection_init 대기 상한. 넘기면 연결을 닫는다.
      connection-init-timeout: 60s
  data:
    redis:
      # refresh 토큰 저장소(Valkey). 값은 전부 환경변수 외부화.
      host: ${IEURI_VALKEY_HOST:localhost}
      port: ${IEURI_VALKEY_PORT:6379}
      # 비밀값: 커밋 금지. prod는 환경변수 주입, local은 인증 없는 개발 인스턴스(빈 값).
      password: ${IEURI_VALKEY_PASSWORD:}
      # command timeout: 장애 시 요청 스레드가 무한정 매달리지 않도록 반드시 둔다.
      timeout: 2s
      client-name: ieuri
  mail:
    # OCI Email Delivery(도쿄 리전). 자격증명은 환경변수로만 주입한다.
    # 미주입 시 기동은 되고 발송만 실패한다(SPEC-0016).
    host: smtp.email.ap-tokyo-1.oci.oraclecloud.com
    port: 587
    username: ${OCI_SMTP_USER:}
    password: ${OCI_SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      # required까지 켜야 한다 — enable만으로는 STARTTLS 미제공 시 평문으로 강등된다.
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

management:
  endpoints:
    web:
      exposure:
        # health와 prometheus만 연다 — Security가 전 경로 permitAll이라 여기서 닫지 않으면 그대로 공개된다.
        # 외부 차단은 Ingress(ingress.blockActuator)가 맡는다. 이 값을 늘리기 전에 그 차단이 유효한지 함께 본다.
        include: health,prometheus

  # 메트릭 OTLP 푸시는 끈다 — Alloy가 /actuator/prometheus를 긁는다. 켜면 localhost:4318로 푸시가 계속 실패하거나 중복 수집된다.
  otlp:
    metrics:
      export:
        enabled: false

  # Security 필터체인 관측을 끈다 — 요청마다 span 네 개가 붙어 트레이스 목록을 채운다.
  observations:
    enable:
      spring.security: false

  # 트레이스 표본 1%. dev·prod 파일도 같은 값이다. IEURI_TRACING_SAMPLE_RATE는 장애 재현 때만 덮어쓰는 탈출구다.
  tracing:
    sampling:
      probability: ${IEURI_TRACING_SAMPLE_RATE:0.01}

  # 트레이스 내보낼 주소는 여기 두지 않는다 — 값이 없는 환경(local)에서 placeholder 해석 실패로 부팅이 깨진다.
  # 주소는 application-{dev,prod}.yaml이 갖는다.

  endpoint:
    health:
      # k8s 프로브용 /actuator/health/{readiness,liveness} 하위 경로를 만든다.
      probes:
        enabled: true
      # 상세는 인증 없이 노출하지 않는다 — DB 호스트·드라이버 같은 내부 정보가 실린다.
      show-details: never
      group:
        # liveness에는 외부 의존성을 넣지 않는다 — DB·Valkey 흔들림이 재시작 루프가 된다.
        liveness:
          include: livenessState
        # readiness에서도 db·redis를 뺀다 — 일시적 DB 단절에 전 파드가 동시에 NotReady가 된다.
        readiness:
          include: readinessState

server:
  # 배포 환경(dev·운영)의 포트. 로컬은 application-local.yaml에서 8888로 덮어쓴다.
  port: 8080
  # 종료 시 처리 중인 요청을 timeout-per-shutdown-phase 안에서 마무리하고 내려간다.
  shutdown: graceful

ieuri:
  # 읽기 복제본 — 같은 CNPG 클러스터의 `-ro` 서비스. 계정은 spring.datasource와 같다.
  # - 비어 있으면 라우팅을 만들지 않고 전부 primary로 간다(local·batch).
  # - `@Transactional(readOnly = true)`만 replica로 간다. 애노테이션 없는 조회·쓰기 트랜잭션 안 조회는 primary.
  read-replica:
    url: ${IEURI_DB_RO_URL:}
  # 검색 전용 노드(SPEC-0013). 메인과 다른 DB 인스턴스이며 읽기 전용이다 — 앱이 쓰면 논리 복제와 충돌한다.
  # - 비밀번호가 메인과 다르다(시크릿 ieuri-search-app).
  # - `prepareThreshold=0`을 빼면 안 된다(pg_search 0.25.1 버그, ParadeDB #5779). 0.25.2로 올릴 때 걷어낸다.
  search-datasource:
    url: ${IEURI_SEARCH_DB_URL:jdbc:postgresql://localhost:5433/ieuri?prepareThreshold=0}
    username: ${IEURI_SEARCH_DB_USERNAME:ieuri}
    password: ${IEURI_SEARCH_DB_PASSWORD}
  mail:
    from: ${MAIL_FROM:}
  password:
    pepper: ${IEURI_PASSWORD_PEPPER}
  verification:
    ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
  encryption:
    # 환경변수로만 주입(기본값 없음 → 없으면 부팅 실패). local은 application-local.yaml이 덮어쓴다.
    key: ${IEURI_ENCRYPTION_KEY}
    pepper: ${IEURI_ENCRYPTION_PEPPER}
    # 로그인 식별자 HMAC용. 바꾸면 기존 EMAIL 회원이 로그인 불가가 되므로 교체할 수 없다 — 위 pepper와 공유하지 않는다.
    identifier-pepper: ${IEURI_ENCRYPTION_IDENTIFIER_PEPPER}
  jwt:
    issuer: ieuri
    # 환경변수 주입(기본값 없음 → fail-fast). local은 application-local.yaml이 덮어쓴다.
    secret: ${IEURI_JWT_SECRET}
    access-ttl: 5m
    refresh-ttl: 30d
  # Cloudflare R2. 클라이언트가 presigned URL로 직접 PUT한다. 자격증명이 없으면 기동은 되고 발급 시점에 실패한다.
  r2:
    s3-endpoint: ${IEURI_R2_ENDPOINT:}
    access-key: ${IEURI_R2_ACCESS_KEY:}
    secret-access-key: ${IEURI_R2_SECRET_ACCESS_KEY:}
    # 기본값을 두지 않는다 — 환경마다 다르며, 없으면 기동을 막는다.
    bucket: ${IEURI_R2_BUCKET}
    upload-url-ttl: 30m
    max-upload-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  # 프로필 이미지(SPEC-0011). 버킷은 r2와 같아도 되며 경로가 profile/ 구간으로 갈린다.
  profile-image:
    # r2.bucket과 같은 이유로 기본값을 두지 않는다.
    bucket: ${IEURI_R2_BUCKET}
    upload-url-ttl: 30m
    max-upload-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  auth:
    # 회원 감사 로그 만료 삭제 배치(SPEC-0032). 보관 기간은 도메인(AuditRetention)이 소유한다. 출발값(POL-044).
    audit-retention:
      # 한 회차에 지울 최대 건수. 트랜잭션이 회차 단위로 끊긴다.
      batch-size: 1000
      # 한 번의 잡 실행에서 돌 최대 회차 수. 남은 것은 다음 실행이 이어 지운다.
      max-batches-per-run: 100
  community:
    # 커넥션 first 상한. 초과 요청은 오류가 아니라 절삭된다.
    max-page-size: 50
    # 지역 피드 반경 상한. 초과 요청은 절삭된다. 기본 반경은 GraphQL 스키마가 갖는다.
    max-radius-meters: 100000
    # DM 메시지 만료 삭제 배치(SPEC-0017). 보관 기간은 도메인(Message.RETENTION)이 소유한다. 출발값(POL-044).
    message-retention:
      # 한 회차에 지울 최대 건수. 트랜잭션이 회차 단위로 끊긴다.
      batch-size: 1000
      # 한 번의 잡 실행에서 돌 최대 회차 수. 남은 것은 다음 실행이 이어 지운다.
      max-batches-per-run: 100

  # TourAPI(한국관광공사). serviceKey는 4개 언어 공용이며 환경변수로만 주입한다 — 빈 값이면 조회 시 실패한다.
  # 동기화 배치 설정은 application-batch.yaml에 있다.
  tourapi:
    service-key: ${IEURI_TOUR_API_KEY_ENCODING:}
    base-urls:
      KO: https://apis.data.go.kr/B551011/KorService2
      EN: https://apis.data.go.kr/B551011/EngService2
      JA: https://apis.data.go.kr/B551011/JpnService2
      ZH: https://apis.data.go.kr/B551011/ChtService2
    # 비관광 제외 lclsSystm2 코드. [TBD] 실데이터 표본으로 확정 — 초기 빈 목록.
    exclude-lclssystm2: []
    arrange: Q
    # 표출 중인 항목만 수집한다(SPEC-0029). 값을 넓혀도 매핑 단계가 `"1"`만 통과시킨다.
    showflag: "1"
    mobile-os: ETC
    mobile-app: ieuri
    max-radius-meters: 100000
    max-page-size: 100
    # likedSpots(커서)의 first 상한. max-page-size와 다른 계약이라 따로 둔다.
    max-liked-page-size: 100
    # popularSpots 진입 좋아요 하한(SPEC-0029, POL-044).
    min-popular-like-count: 5
    connect-timeout-millis: 3000
    read-timeout-millis: 5000
  # 서울시 실시간 도시데이터(SPEC-0014). 키가 비어 있어도 기동은 된다 — 혼잡도 레이어만 degraded로 응답한다.
  seoul-open-data:
    api-key: ${IEURI_SEOUL_CITYDATA_API_KEY:}
    base-url: ${IEURI_SEOUL_CITYDATA_BASE_URL:http://openapi.seoul.go.kr:8088}
    # 같은 구역 재호출 최소 간격. [TBD]
    min-refetch-seconds: ${IEURI_SEOUL_CITYDATA_MIN_REFETCH_SECONDS:300}
    # 한 번에 조회할 구역 수 상한. 초과는 절삭이 아니라 거절이다(TOO_MANY_AREA_IDS). [TBD]
    max-area-ids: 20
    # 실패해도 degraded로 흡수되므로 오래 기다리지 않는다.
    connect-timeout-millis: 5000
    read-timeout-millis: 10000
  # 한국관광공사 빅데이터 4종(SPEC-0015). 키가 비어 있어도 기동은 된다 — 배치 경로에서만 쓴다.
  kto-big-data:
    # TourAPI와 같은 data.go.kr 계정 키다. 별도 키를 발급하면 여기만 바꾼다.
    service-key: ${IEURI_KTO_BIGDATA_API_KEY:${IEURI_TOUR_API_KEY_ENCODING:}}
    base-urls:
      # 지역별 방문자수 — locgoRegnVisitrDDList
      DATA_LAB: https://apis.data.go.kr/B551011/DataLabService
      # 관광지 집중률 — tatsCnctrRatedList
      TATS_CNCTR_RATE: https://apis.data.go.kr/B551011/TatsCnctrRateService
      # 체류 강도 · 소비 강도 — areaTarSjrnDsList · areaTarExpDsList (한 서비스의 두 오퍼레이션)
      AREA_TAR_DEM_DS: https://apis.data.go.kr/B551011/AreaTarDemDsService
    # 호출 수를 줄이는 값이다 — 집중률은 시군구마다 호출하므로 페이지가 갈리면 호출이 배가돼 일 한도를 다 쓴다.
    page-size: 10000
    # 수요강도 지표 코드(21=체류, 22=소비). 빼면 오류 없이 0건이 온다.
    stay-index-code: "21"
    spending-index-code: "22"
    connect-timeout-millis: 5000
    # 배치 경로라 길게 잡는다.
    read-timeout-millis: 30000

    # 아래 계수는 사용자 판단이며 실측값이 아니다(POL-044).
    score-weights:
      CONGESTION: 2.0
      VISITOR_VOLUME: 1.0
      STAY_INTENSITY: 1.5
      SPENDING_INTENSITY: 1.5
      DISTANCE: 4.0
    distance-half-life-meters: 8000.0
    freshness-plateau-days: 7
    freshness-half-life-days: 23.0
    # 최소 산출 항목 수(경계 포함). 거리가 항상 포함되므로 5는 "지표 4종이 다 있어야 한다"는 뜻이다.
    min-factor-count: 5
    # 시군구가 이 수보다 적은 시도는 추천 대상에서 뺀다.
    min-districts-per-province: 3
    # POL-018. 상한 초과는 오류가 아니라 클램프.
    default-limit: 10
    max-limit: 50

  # 지도 뷰포트 조회(SPEC-0014). 수치는 전부 [TBD]. 카카오맵 줌은 1~14이며 클수록 확대다.
  map-viewport:
    min-zoom: 1
    max-zoom: 14
    # 뷰포트 면적 상한(위경도 도 곱). 4.0은 대략 남한 전체 크기다.
    max-area-square-degrees: 4.0
    max-spot-markers: 500
    max-event-markers: 200
    # 영역 추천의 후보 상한(SPEC-0036) — 중심점에서 가까운 순 이 수만큼만 점수를 계산한다.
    # tourism.recommendation.candidate-cap과 다른 노브다. 값을 공유하지 않는다.
    recommendation-candidate-cap: 2000
    # 추천 묶음 크기 상한(POL-018). 초과 요청은 거절이 아니라 절삭이다. 기본값 10은 스키마에 있다.
    max-recommendation-size: 100

  tourism:
    # 비관광 spot 제외 판정(SPEC-0018). 출발값이다(POL-044).
    # - 영문 키워드는 단어 경계로 감싼다(`CU`가 `Security`를 잡지 않도록). 한글은 부분 일치다.
    # - 대소문자를 구분하지 않는다. TOURIST_SPOT·CULTURAL_FACILITY는 키워드에 걸려도 제외하지 않는다.
    # - `Pharm` 같은 짧은 어간은 넣지 않는다. 목록을 고친 뒤에는 전환 건수의 급변을 확인한다.
    spot-exclusion:
      keywords:
        # 약국
        - 약국
        - Pharmacy
        # 편의점
        - CU
        - 씨유
        - GS25
        - 세븐일레븐
        - 7-Eleven
        - 이마트24
        - emart24
        - E-Mart 24
        - 미니스톱
        - MINISTOP
        - 스토리웨이
        # 의원·병원
        - 의원
        - 한의원
        - Clinic
        - Dermatology
        - 병원
        - Hospital
        - 치과
        - Dental
        # 진료과(SPEC-0029). `외과` 하나가 정형외과·성형외과 등을 전부 잡는다.
        # 오탐 감시 대상: `안과`(안과학회관 류), `내과`(내과대학 류).
        - 외과
        - 내과
        - 피부과
        - 안과
        - 이비인후과
        - 산부인과
        - 소아과
        - 정신과
        - 비뇨기과
        - 재활의학과
        - 영상의학과
        - 마취통증의학과
        # 의료 시설
        - 보건소
        - 의료원
        - 요양원
        - 요양병원
        - 검진센터
        - 산후조리원
        - 동물병원
        - Medical Center
        - Oriental Medicine
        - Veterinary
      # 병원·의원에 입점한 소매점을 제외에서 되살린다.
      branch-name-patterns:
        - 병원점
        - 병원 지점
        - Hospital Branch
        - 의원점
        - 약국점
        - Clinic Branch

    # 내 주변 추천(SPEC-0035). 출발값이다(POL-044).
    recommendation:
      # 거리 요인이 0.5가 되는 거리.
      distance-half-life-meters: 5000
      tax-refund-multiplier: 0.8
      # 면세 태그 표기. 제목 문자열만 보며, 태그가 없는 행은 감점 없이 계산된다.
      tax-refund-title-patterns:
        - "[Tax Refund Shop]"
        - "[事後免税店]"
        - "[事後免稅店]"
        - "[면세점(TAX REFUND SHOP)]"
      # 같은 카테고리 n번째 장소에 깎는 penalty × (n − 1). 0이면 순수 점수순.
      category-repeat-penalty: 0.1
      # 후보 상한 N — 거리 가까운 순 N건만 점수·재배열 대상이다.
      # 이 값이 DB 작업량을 직접 정한다. 300에서 FR-006(카테고리 60% 이하) 위반, 350에서 통과(3지점 실측, SPEC-0038).
      candidate-cap: 500
      # 취향이 있으면 (1 − w)·거리 + w·취향. 반응(좋아요 + 싫어요)이 최소 수 미만이면 취향 없음.
      taste-weight: 0.5
      taste-min-reactions: 5
      # 이미 반응한 장소의 점수 배율(SPEC-0036). 제외가 아니라 순위 조정이다. 출발값(POL-044).
      liked-multiplier: 1.1
      disliked-multiplier: 0.4
      embedding:
        # 차원은 spot_embedding.embedding vector(1024)와 같아야 한다 — 바꾸면 마이그레이션이 따른다.
        model: voyage-4
        dimension: 1024
        # Voyage 요청당 입력 상한(1,000건·320K 토큰) 안이어야 한다.
        batch-size: 128
        # 제공자 실패 시 즉시 재시도 횟수(대기 없음, POL-040). 그래도 실패하면 다음 실행이 다시 잡는다.
        retry-count: 3
        # 임베딩 텍스트에 넣는 소개문 길이 상한(토큰 비용의 천장). 상한 안 마지막 문장 끝에서 자른다.
        overview-max-chars: 500

  # Voyage 임베딩 API(SPEC-0035). 키가 비면 기동은 되고 임베딩 단계만 실패로 센다(취향 요인만 없음).
  voyage:
    api-key: ${IEURI_VOYAGE_API_KEY:}
    base-url: https://api.voyageai.com
    connect-timeout-millis: 5000
    # 요청 하나에 텍스트 128건이 실리는 배치 경로라 길게 잡는다.
    read-timeout-millis: 60000
  # SNS id_token 검증. aud 값은 공개 식별자라 env 오버라이드 가능한 기본값으로 둔다. 모든 환경에서 실검증한다.
  sns:
    google:
      # aud는 플랫폼별로 다르다(iOS→iOS 클라이언트 ID, Android/Web→웹 클라이언트 ID). 하나라도 일치하면 통과.
      client-ids:
        - ${GOOGLE_WEB_CLIENT_ID:504325192446-69cc1ljfcrl5364632mrssn1dmeh43h8.apps.googleusercontent.com}
        - ${GOOGLE_IOS_CLIENT_ID:504325192446-vvqljuqs07v73fq5093ekl1ijt6q1cm7.apps.googleusercontent.com}
        - ${GOOGLE_ANDROID_CLIENT_ID:504325192446-69cc1ljfcrl5364632mrssn1dmeh43h8.apps.googleusercontent.com}
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers:
        - https://accounts.google.com
        - accounts.google.com
    apple:
      audiences:
        - ${APPLE_AUDIENCE:kr.ieuri.ktripspot}
      jwks-uri: https://appleid.apple.com/auth/keys
      issuer: https://appleid.apple.com
    kakao:
      # aud는 로그인에 쓴 네이티브 앱 키다(REST API 키 아님). 올 수 있는 값만 허용한다.
      app-keys:
        - ${KAKAO_NATIVE_APP_KEY:f3d974f8c5a77ab1fb0673c353f9cb62}
      jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
      issuer: https://kauth.kakao.com
  # 탈퇴 시 provider 연결 해제 자격증명(SPEC-0012). 환경변수로만 주입하며 기본값을 두지 않는다.
  # 값이 비면 해당 provider 해제는 실패로 기록되고 탈퇴 자체는 계속된다.
  sns-revoke:
    apple:
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      client-id: ${APPLE_CLIENT_ID:}
      # .p8 파일 경로(file:/... 또는 classpath:...). 파일은 커밋하지 않고 Secret 볼륨으로 마운트한다.
      private-key-location: ${APPLE_PRIVATE_KEY_PATH:}
    google:
      client-id: ${GOOGLE_REVOKE_CLIENT_ID:}
      client-secret: ${GOOGLE_REVOKE_CLIENT_SECRET:}
    kakao:
      # 어드민 키 + 회원번호로 해제하므로 토큰 저장이 필요 없다.
      admin-key: ${KAKAO_ADMIN_KEY:}
    # 탈퇴 트랜잭션 안에서 호출하므로 대기 상한이 필수다.
    timeout: 3s
  fcm:
    # 앱 푸시 발송(SPEC-0028, POL-027). 서비스 계정 JSON 경로이며 파일은 커밋하지 않는다.
    # JSON을 환경변수에 통째로 넣지 않는다 — 개행이 깨지고 /proc/<pid>/environ으로 노출된다. Secret 볼륨 경로로 준다.
    # 빈 값이면 기동은 되고 발송만 실패한다.
    service-account-location: ${IEURI_FCM_SERVICE_ACCOUNT_PATH:}
    # FCM 호출 대기 상한. 기본값(무제한)이면 응답 없는 FCM이 발송 워커를 붙들어 큐가 막힌다.
    timeout: 10s
