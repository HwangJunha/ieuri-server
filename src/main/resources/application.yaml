spring:
  application:
    name: ieuri
  threads:
    virtual:
      # 요청 처리와 데이터페처를 가상 스레드로 돌린다(Java 21+). 블로킹 I/O가 캐리어 스레드를
      # 반납하므로 스레드 수가 동시 처리량의 상한이 아니게 된다.
      # DGS 키(dgs.graphql.virtualthreads.enabled)도 이 값을 따라 켜진다.
      #
      # **요청별 값을 ThreadLocal에 담지 않는 것이 전제다.** 데이터페처가 다른 스레드에서
      # 돌기 때문에, 요청 스코프 빈(RequestContextHolder 기반)을 쓰면 그 순간 사라진다.
      # 언어·앱키는 DataFetchingEnvironment에서 읽는다(공유 커널의 acceptLanguage).
      enabled: true
  lifecycle:
    # graceful shutdown 단계별 최대 대기. write-behind 큐도 이 안에서 정리된다
    # (큐 자체는 @PreDestroy에서 별도로 유한 대기한다).
    timeout-per-shutdown-phase: 20s
  profiles:
    default: local
  datasource:
    url: ${IEURI_DB_URL:jdbc:postgresql://localhost:5432/ieuri}
    username: ${IEURI_DB_USERNAME:ieuri}
    # 비밀값: 커밋 금지. prod는 환경변수 주입, local은 셸 환경변수(IEURI_DB_PASSWORD)로 제공.
    password: ${IEURI_DB_PASSWORD}
    hikari:
      keepalive-time: 120000
      # 첫 커넥션 확보를 30초까지 재시도(기본 1초는 즉시 실패). 로컬 port-forward 터널이
      # Flyway 반납 직후 재연결되는 구간에서 기동이 깨졌다.
      initialization-fail-timeout: 30000
  jpa:
    hibernate:
      # 스키마 소유권은 Flyway. Hibernate는 엔티티↔스키마 검증만 한다.
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      # **부팅 시 잡을 자동 실행하지 않는다** — 끄지 않으면 재배포마다 전량 동기화가 돈다.
      # 기본값이 true라 명시적으로 꺼야 한다(Boot 4에서도 이 키가 읽힌다).
      enabled: false

  # spring.batch.jdbc.*는 두지 않는다 — Boot 4에 없는 키라 조용히 무시된다. 메타데이터
  # 저장소는 BatchInfrastructureConfig의 @EnableJdbcJobRepository가, 스키마는 Flyway가 소유한다(V14).
  flyway:
    enabled: true
    # Java 마이그레이션(V39)은 여기 없어도 된다 — Boot가 JavaMigration 빈을 주입해 등록한다.
    # 오히려 여기 패키지를 더하면 컴파일된 클래스 디렉터리를 중복 스캔해 "more than one migration"으로 부팅이 깨진다.
    locations: classpath:db/migration
    # 공유 DB의 public 스키마에 무관한 기존 객체가 있을 수 있어, v0로 baseline 후 V1부터 전부 적용한다
    # (기존 DB에 Flyway를 도입하는 표준 방식). baseline-version=0이라 V1 마이그레이션이 스킵되지 않는다.
    baseline-on-migrate: true
    baseline-version: 0
    # 적용된 적 있는 R__ 파일을 지우면 validate가 APPLIED_REPEATABLE_MIGRATION_NOT_RESOLVED로
    # 막는다. 시드용 R__은 의도적으로 지울 수 있으므로(R__seed_test_account를 시드더로 옮겼다)
    # 그 경우만 무시한다. 버전 마이그레이션(V__)의 누락·체크섬 변경은 그대로 잡힌다.
    ignore-migration-patterns: "repeatable:missing"
  graphql:
    websocket:
      # 구독(Subscription) 전송 경로. **명시하지 않으면 WebSocket 핸들러가 등록되지 않아
      # 구독이 아예 붙지 않는다** — HTTP 엔드포인트만 열려 있고 조용히 실패한다.
      # 인증은 connection_init에서 1회 수행한다(GraphqlWebSocketAuthInterceptor, POL-048).
      path: /graphql
      # 연결 수립(connection_init)을 기다리는 상한. 넘기면 연결을 닫는다.
      connection-init-timeout: 60s
  data:
    redis:
      # refresh 토큰 저장소(Valkey, Redis 프로토콜 호환). 값은 전부 환경변수 외부화.
      host: ${IEURI_VALKEY_HOST:localhost}
      port: ${IEURI_VALKEY_PORT:6379}
      # 비밀값: 커밋 금지. prod는 환경변수 주입, local은 인증 없는 개발 인스턴스(빈 값).
      password: ${IEURI_VALKEY_PASSWORD:}
      # command timeout: 장애 시 요청 스레드가 무한정 매달리지 않도록 반드시 둔다.
      timeout: 2s
      client-name: ieuri
  mail:
    # OCI Email Delivery(도쿄 리전). 자격증명은 환경변수로만 주입하며 리터럴 기본값을 두지 않는다.
    # 빈 문자열 기본값은 미주입 시 부팅을 깨뜨리지 않기 위한 것이다 — 자격증명이 없으면
    # 기동은 되고 발송만 실패한다(SPEC-0016 R4). 암호화 키와 달리 실패 범위가 메일에 한정된다.
    host: smtp.email.ap-tokyo-1.oci.oraclecloud.com
    port: 587
    username: ${OCI_SMTP_USER:}
    password: ${OCI_SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      # required까지 켜야 한다. enable만으로는 서버가 STARTTLS를 제공하지 않을 때 평문으로
      # 강등되어 인증 코드가 그대로 나간다.
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  port: 8888
  # 종료 시 처리 중인 요청을 마무리하고 내려간다(SPEC-0004 R-16). 무한 대기가 아니라
  # timeout-per-shutdown-phase 안에서만 기다린다 — 배포·재시작을 붙잡으면 안 된다.
  shutdown: graceful

ieuri:
  # 검색 전용 노드(SPEC-0013). 메인과 **다른 DB 인스턴스**이고 **읽기 전용이다** — spot이
  # 논리 복제로 들어오므로 앱이 쓰면 복제와 충돌한다. DDL만 Flyway가 만든다.
  #
  # **비밀번호가 메인과 다르다** — CNPG가 클러스터마다 앱 계정 시크릿을 새로 만든다:
  #   kubectl get secret -n ieuri-db ieuri-search-app -o jsonpath='{.data.password}' | base64 -d
  #
  # **`prepareThreshold=0`을 빼면 안 된다**(pg_search 0.25.1 버그, ParadeDB #5779). 같은 구문
  # 6번째 실행부터 generic plan으로 바뀌며 질의어가 Param이 되어 `@@@` 분류가 깨진다 —
  # 간헐적으로 보여 재현이 어렵다. 0.25.2로 올릴 때 걷어낸다.
  search-datasource:
    url: ${IEURI_SEARCH_DB_URL:jdbc:postgresql://localhost:5433/ieuri?prepareThreshold=0}
    username: ${IEURI_SEARCH_DB_USERNAME:ieuri}
    password: ${IEURI_SEARCH_DB_PASSWORD}
  mail:
    from: ${MAIL_FROM:}
  password:
    pepper: ${IEURI_PASSWORD_PEPPER}
  verification:
    ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
  encryption:
    # prod: 환경변수로만 주입(기본값 없음 → 없으면 부팅 실패, fail-fast).
    # local: application-local.yaml이 개발 전용 값으로 오버라이드한다.
    key: ${IEURI_ENCRYPTION_KEY}
    pepper: ${IEURI_ENCRYPTION_PEPPER}
    # 로그인 식별자 보호(HMAC)용. 바꾸면 기존 EMAIL 회원이 로그인 불가가 되므로 사실상 교체 불가다.
    # 그래서 교체 가능해야 하는 위 pepper와 값을 공유하지 않는다.
    identifier-pepper: ${IEURI_ENCRYPTION_IDENTIFIER_PEPPER}
  jwt:
    issuer: ieuri
    # prod: 환경변수 주입(기본값 없음 → fail-fast). local: application-local.yaml이 오버라이드.
    secret: ${IEURI_JWT_SECRET}
    access-ttl: 5m
    refresh-ttl: 30d
  # Cloudflare R2(S3 호환). 사진은 클라이언트가 presigned URL로 직접 PUT하고 서버는 중계하지 않는다.
  # 자격증명은 환경변수로만 주입한다 — 없어도 부팅은 되고 발급 시점에 실패한다.
  # DB에는 object key만 저장하므로 조회용 공개 도메인은 서버가 알 필요가 없다.
  r2:
    s3-endpoint: ${IERUI_R2_ENDPOINT:}
    access-key: ${IEURI_R2_ACCESS_KEY:}
    secret-access-key: ${IEURI_R2_SECRET_ACCESS_KEY:}
    bucket: ${IEURI_R2_BUCKET:ieuri-dev}
    # 여러 장을 연달아 올리는 동안 만료되지 않아야 한다. 모바일에서 대용량 사진은 느리다.
    upload-url-ttl: 30m
    max-upload-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  # 프로필 이미지(SPEC-0011 R6). 버킷은 r2와 같아도 되며 경로가 profile/ 구간으로 갈린다.
  profile-image:
    bucket: ${IEURI_R2_BUCKET:ieuri-dev}
    upload-url-ttl: 30m
    max-upload-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  community:
    # 커넥션 first 상한. 초과 요청은 오류가 아니라 절삭된다.
    max-page-size: 50
    # 지역 피드 반경 상한. 초과 요청은 상한으로 절삭된다.
    # (기본 반경 20000은 GraphQL 스키마의 기본값이라 여기 두지 않는다 — 두 곳에 두면 갈린다.)
    max-radius-meters: 100000
    # DM 메시지 보관 기간(6개월) 만료 삭제 배치(SPEC-0017 R16).
    # **실측 전까지 확정값이 아니다**(POL-044) — 회차 크기는 락·WAL 관측 후 조정한다.
    # 보관 기간 자체는 정책이라 도메인(Message.RETENTION)이 소유하며 설정으로 빼지 않는다.
    message-retention:
      # 한 회차에 지울 최대 건수. 트랜잭션이 회차 단위로 끊긴다.
      batch-size: 1000
      # 한 번의 잡 실행에서 돌 최대 회차 수. 남은 것은 다음 실행이 이어 지운다.
      max-batches-per-run: 100

  # SNS id_token 검증. aud로 검증할 클라이언트 ID/앱 키는 공개 식별자라 env 오버라이드
  # 가능한 기본값으로 둔다. jwks-uri/issuer는 provider 고정값. 모든 환경에서 실검증한다.
  # TourAPI(한국관광공사) 접근. serviceKey는 4개 언어 공용 단일 키(실측 B-4) — 언어는 base-url 선택에만 영향.
  # serviceKey는 환경변수로만 주입한다(응답·로그·GraphQL 어디에도 노출 금지, fail-fast 없이 빈 값이면 조회 시 실패).
  tourapi:
    service-key: ${IEURI_TOUR_API_KEY_ENCODING:}
    base-urls:
      KO: https://apis.data.go.kr/B551011/KorService2
      EN: https://apis.data.go.kr/B551011/EngService2
      JA: https://apis.data.go.kr/B551011/JpnService2
      ZH: https://apis.data.go.kr/B551011/ChtService2
    # 도메인 카테고리 → 언어별 TourAPI contentTypeId. 값 보정이 코드 수정 없이 가능하도록 설정으로 둔다.
    category-codes:
      KO:
        TOURIST_SPOT: 12
        CULTURAL_FACILITY: 14
        FESTIVAL_EVENT: 15
        TRAVEL_COURSE: 25
        LEISURE_SPORTS: 28
        LODGING: 32
        SHOPPING: 38
        RESTAURANT: 39
      FOREIGN:
        TOURIST_SPOT: 76
        CULTURAL_FACILITY: 78
        FESTIVAL_EVENT: 85
        LEISURE_SPORTS: 75
        LODGING: 80
        SHOPPING: 79
        RESTAURANT: 82
        TRANSPORT: 77
    # 비관광 제외 lclsSystm2 코드(다국어 공통). [TBD] 실데이터 표본으로 확정 — 초기 빈 목록.
    exclude-lclssystm2: []
    arrange: Q
    # 관광지 동기화 배치 설정은 application-batch.yaml에 있다. 잡·런처·스케줄러 빈이
    # 전부 @Profile("batch")라, batch 프로파일 없이 뜬 API 서버에는 아예 존재하지 않는다.
    mobile-os: ETC
    mobile-app: ieuri
    max-radius-meters: 100000
    max-page-size: 100
    # likedSpots(커서)의 first 상한. max-page-size와 값은 같지만 다른 계약이라 따로 둔다 —
    # 하나를 조정할 때 다른 하나가 조용히 따라가지 않도록.
    max-liked-page-size: 100
    # 상세 본문 "부재" 행의 신선도 기준(SPEC-0008 [TBD-1]). 정상 행에는 만료가 없고 부재 행에만
    # 적용된다 — 업스트림에 나중에 데이터가 생길 수 있어 정상보다 짧게 잡는다.
    detail-absence-ttl: 7d
    connect-timeout-millis: 3000
    read-timeout-millis: 5000
  # 서울시 실시간 도시데이터(SPEC-0014). 인증키는 환경변수로만 주입한다.
  # **키가 비어 있어도 기동에 실패하지 않는다** — 혼잡도 레이어만 degraded로 응답하고
  # 지도의 나머지는 정상 동작한다. 로컬에서 키 없이 지도를 띄울 수 있어야 한다.
  seoul-open-data:
    api-key: ${IEURI_SEOUL_CITYDATA_API_KEY:}
    base-url: ${IEURI_SEOUL_CITYDATA_BASE_URL:http://openapi.seoul.go.kr:8088}
    # 같은 구역 재호출 최소 간격. 데이터가 약 30분 지연되어 도착하므로 5분 경계 TTL은
    # 같은 데이터를 반복 호출한다 — [TBD] 실측 후 크게 잡을수록 호출량이 준다.
    min-refetch-seconds: ${IEURI_SEOUL_CITYDATA_MIN_REFETCH_SECONDS:300}
    # 한 번에 조회할 구역 수 상한. 벌크 호출이 없어 구역 수가 곧 호출 수라 클램프가
    # 아니라 거절이다(TOO_MANY_AREA_IDS). [TBD]
    max-area-ids: 20
    # TourAPI보다 짧게 잡는다 — 실패해도 degraded로 흡수되므로 오래 매달리는 것보다
    # 빨리 포기하고 캐시를 주는 편이 낫다.
    connect-timeout-millis: 5000
    read-timeout-millis: 10000
  # 한국관광공사 빅데이터 4종(SPEC-0015). 인증키는 4종 공용 단일 키이며 환경변수로만 주입한다.
  # **키가 비어 있어도 기동에 실패하지 않는다** — 배치 경로에서만 쓰므로 API 서버는 영향이 없다.
  tour-stats:
    # TourAPI와 같은 data.go.kr 계정 키다(둘 다 B551011). 별도 키를 발급하면 여기만 바꾼다.
    service-key: ${IEURI_KTO_BIGDATA_API_KEY:${IEURI_TOUR_API_KEY_ENCODING:}}
    # 서비스 경로가 셋으로 갈린다(§4.7). tourapi의 언어별 base-url과 성격이 달라 블록을 나눴다.
    base-urls:
      # 지역별 방문자수 — locgoRegnVisitrDDList
      DATA_LAB: https://apis.data.go.kr/B551011/DataLabService
      # 관광지 집중률 — tatsCnctrRatedList
      TATS_CNCTR_RATE: https://apis.data.go.kr/B551011/TatsCnctrRateService
      # 체류 강도 · 소비 강도 — areaTarSjrnDsList · areaTarExpDsList (한 서비스의 두 오퍼레이션)
      AREA_TAR_DEM_DS: https://apis.data.go.kr/B551011/AreaTarDemDsService
    # **호출 수를 줄이는 값이다.** 집중률은 시군구마다 따로 호출해야 해서(252회) 페이지가
    # 갈리면 그만큼 호출이 배가된다 — 1000이면 약 1,000회로 개발 계정 일 한도를 다 쓴다.
    # 10000이면 전 지역이 1페이지에 끝나 252회다.
    #
    # 실측(2026-08-11): 지역별 최대가 제주시 7,320행(2위 서귀포 6,120)이고 numOfRows=10000이
    # 거부되지 않는다. 상한이 문서화된 값은 아니므로 페이징 로직은 그대로 살려 둔다 —
    # 관광지가 늘어 10000을 넘으면 자동으로 2페이지가 된다.
    page-size: 10000
    # 수요강도 지표 코드. **빼면 오류 없이 0건이 온다** — 21=관광체류강도, 22=관광소비강도(전체).
    stay-index-code: "21"
    spending-index-code: "22"
    connect-timeout-millis: 5000
    # 배치 경로라 요청 스레드를 매달지 않는다 — TourAPI 조회(5초)보다 길게 잡는다.
    read-timeout-millis: 30000

    # 아래 계수는 **사용자 판단이며 실측값이 아니다**(POL-044). 이전 균등 1.0 잠정값을 대체한다.
    #
    # 거리 비중이 낮으면 어디서 조회해도 같은 곳이 나온다 — 실측에서 서울 4개 지점 중
    # 3곳이 강남구를 1위로 뽑았다. 반감 8km는 인접 시군구까지가 "근처"라는 뜻이다.
    score-weights:
      CONGESTION: 2.0
      VISITOR_VOLUME: 1.0
      STAY_INTENSITY: 1.5
      SPENDING_INTENSITY: 1.5
      DISTANCE: 4.0
    distance-half-life-meters: 8000.0
    freshness-plateau-days: 7
    freshness-half-life-days: 23.0
    # 최소 산출 항목 수(R30). 경계값 포함. 근거가 얕은 지역이 우연히 상위에 오는 것을 막는다.
    # **거리가 항상 포함된다** — origin이 필수 인자라 5는 "지표 4종이 다 있어야 한다"는 뜻이고
    # 4는 "지표 3종"이다. 실측에서 화성시가 체류·소비 강도 결측(지표 3종)인데도 7위였다 —
    # 항목 수가 다르면 총점이 같은 척도가 아니다(§3.5).
    min-factor-count: 5
    # 시군구가 이 수보다 적은 시도는 추천 대상에서 뺀다. 세종(1개)·제주(2개)는 고를 것이
    # 없어 추천이 성립하지 않는다. 시도 이름을 박지 않는 이유는 행정구역이 바뀌기 때문이다.
    min-districts-per-province: 3
    # R19 · POL-018. 상한 초과는 오류가 아니라 클램프.
    default-limit: 10
    max-limit: 50

  # 지도 뷰포트 조회(SPEC-0014). 아래 수치는 전부 [TBD]이며 실측으로 확정한다 —
  # 코드 수정 없이 조정하려고 설정으로 뺐다. 카카오맵 줌은 1~14이며 클수록 확대다.
  map-viewport:
    min-zoom: 1
    max-zoom: 14
    # 뷰포트 면적 상한(위경도 도 곱). 전 지구 bbox 한 번으로 전체를 긁어가는 것을 막는
    # 것이 목적이라 정밀할 필요가 없다. 4.0은 대략 2°×2°로 남한 전체를 담는 크기다.
    max-area-square-degrees: 4.0
    max-spot-markers: 500
    max-event-markers: 200

  tourism:
    # 비관광 spot 제외 판정(SPEC-0018). **출발 값이지 확정값이 아니다** — 오탐은 사후에
    # 드러나는 성격이라, 배포 없이 고칠 수 있도록 설정에 둔다(POL-044).
    #
    # 판정 방식:
    #   - 영문 키워드는 단어 경계(\b)로 감싼다. **가장 위험한 항목이 `CU`다** — 경계 없이 쓰면
    #     실측 표본에서 52건이 아니라 262건이 걸리고, 늘어난 210건은 전부 오탐이다
    #     (인사동 문화의 거리, 문화역 서울 284, 판문점 Joint Se*cu*rity Area).
    #   - 한글 키워드는 경계를 두지 않는다 — 교착어라 `명동명약국`처럼 접사 없이 붙는다.
    #   - 대소문자를 구분하지 않는다(`emart24`·`E-Mart 24` 표기 혼재).
    #   - TOURIST_SPOT·CULTURAL_FACILITY는 키워드에 걸려도 제외하지 않는다(코드가 소유).
    #
    # **목록을 고친 뒤에는 전환 건수의 급변을 확인한다** — 급증은 키워드가 넓어졌다는 신호다.
    # `Pharm` 같은 짧은 어간은 넣지 않는다: `Pharmaceutical` 같은 정상 상호를 건다.
    spot-exclusion:
      keywords:
        # 약국
        - 약국
        - Pharmacy
        # 편의점
        - CU
        - 씨유
        - GS25
        - 세븐일레븐
        - 7-Eleven
        - 이마트24
        - emart24
        - E-Mart 24
        - 미니스톱
        - MINISTOP
        - 스토리웨이
        # 의원·병원
        - 의원
        - 한의원
        - Clinic
        - Dermatology
        - 병원
        - Hospital
        - 치과
        - Dental
      # 병원·의원에 입점한 소매점을 되살린다 — 실측 3건이 전부 화장품 매장이었다
      # (올리브영 제주대학병원점, 탠저비 한라병원점).
      branch-name-patterns:
        - 병원점
        - 병원 지점
        - Hospital Branch
        - 의원점
        - 약국점
        - Clinic Branch
  sns:
    google:
      # id_token의 aud는 플랫폼별로 다르다: iOS→iOS 클라이언트 ID, Android/Web→웹 클라이언트 ID.
      # 셋 다 허용한다(하나라도 일치하면 통과).
      client-ids:
        - ${GOOGLE_WEB_CLIENT_ID:504325192446-69cc1ljfcrl5364632mrssn1dmeh43h8.apps.googleusercontent.com}
        - ${GOOGLE_IOS_CLIENT_ID:504325192446-vvqljuqs07v73fq5093ekl1ijt6q1cm7.apps.googleusercontent.com}
        - ${GOOGLE_ANDROID_CLIENT_ID:504325192446-69cc1ljfcrl5364632mrssn1dmeh43h8.apps.googleusercontent.com}
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers:
        - https://accounts.google.com
        - accounts.google.com
    apple:
      audiences:
        - ${APPLE_AUDIENCE:kr.ieuri.ktripspot}
      jwks-uri: https://appleid.apple.com/auth/keys
      issuer: https://appleid.apple.com
    kakao:
      # 카카오 OIDC id_token의 aud는 "로그인에 사용한 앱 키"다. 앱은 네이티브 앱 키로
      # 로그인하므로 aud도 네이티브 앱 키다(REST API 키가 아님). 실제로 올 수 있는 값만
      # 허용한다(허용 aud는 최소로 — 오지 않을 REST 키를 넣으면 검증만 느슨해진다).
      app-keys:
        - ${KAKAO_NATIVE_APP_KEY:f3d974f8c5a77ab1fb0673c353f9cb62}
      jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
      issuer: https://kauth.kakao.com
  # 탈퇴 시 provider 연결 해제용 자격증명(SPEC-0012). 위 sns 블록의 공개 식별자와 성격이 달라
  # 일부러 분리했다 — 섞으면 실수로 로그에 찍기 쉽다. 전부 환경변수로만 주입하며 기본값을 두지 않는다.
  # 값이 비면 해당 provider 해제는 실패로 기록되고 탈퇴 자체는 계속된다.
  sns-revoke:
    apple:
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      client-id: ${APPLE_CLIENT_ID:}
      # .p8 파일 경로(file:/... 또는 classpath:...). 파일 자체는 저장소에 커밋하지 않는다.
      # k8s/k3s는 Secret을 볼륨으로 마운트하고 그 경로를 준다 — 환경변수로 PEM을 넣으면
      # 개행 이스케이프가 깨지기 쉽고 /proc/<pid>/environ에 노출된다.
      private-key-location: ${APPLE_PRIVATE_KEY_PATH:}
    google:
      client-id: ${GOOGLE_REVOKE_CLIENT_ID:}
      client-secret: ${GOOGLE_REVOKE_CLIENT_SECRET:}
    kakao:
      # 어드민 키 + 회원번호로 해제하므로 토큰 저장이 필요 없다.
      admin-key: ${KAKAO_ADMIN_KEY:}
    # 탈퇴 트랜잭션 안에서 호출하므로 대기 상한이 필수다(R11).
    timeout: 3s
